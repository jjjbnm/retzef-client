<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Discord Bots</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#101010;--panel2:#151515;--line:#252525;--muted:#a1a1aa;--text:#f5f5f5;--accent:#8b5cf6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{width:min(880px,100% - 32px);margin:0 auto;padding:58px 0 72px}
header{margin-bottom:30px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#888;margin:0 0 12px}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.045em;margin:0;font-weight:750}
.subtitle{color:var(--muted);font-size:14px;margin:10px 0 0}
.list{display:flex;flex-direction:column;gap:14px}
.bot{background:linear-gradient(145deg,#121212,#0c0c0c);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:16px;transition:border-color .2s,transform .2s}
.bot:hover{border-color:#444;transform:translateY(-2px)}
.logo{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:24px;font-weight:800;color:white;box-shadow:inset 0 1px 0 #ffffff30;overflow:hidden}
.logo svg{width:34px;height:34px}
.identity{min-width:0}
.name{font-size:18px;font-weight:700;margin:2px 0 7px}
.description{font-size:13px;line-height:1.55;color:#aaa;margin:0;max-width:680px}
.actions{grid-column:2;display:flex;flex-wrap:wrap;gap:9px;margin-top:1px}
.action{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 13px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:650;border:1px solid #303030;color:#ddd;background:#171717;transition:background .2s,border-color .2s}
.action:hover{background:#222;border-color:#555}
.action.primary{background:#f3f3f3;color:#111;border-color:#f3f3f3}
.action.primary:hover{background:#dcdcdc}
footer{margin-top:28px;text-align:center;color:#666;font-size:11px}
@media(max-width:520px){.page{padding-top:38px}.bot{padding:16px;grid-template-columns:48px minmax(0,1fr);gap:13px;border-radius:15px}.logo{width:48px;height:48px;border-radius:14px;font-size:20px}.name{font-size:16px}.description{font-size:12px}.actions{gap:7px}.action{min-height:34px;padding:0 10px;font-size:11px}}
</style>
</head>
<body>
<main class="page">
<header>
<p class="eyebrow">RETZEF CLIENT · DIRECTORY</p>
<h1>Discord Bots</h1>
<p class="subtitle">Discover useful bots for your Discord server.</p>
</header>
<section class="list" id="bot-list" aria-label="Discord bots"></section>
<footer>Bot details and links belong to their respective creators.</footer>
</main>
<script>
const bots = [
 {name:"MEE6",letter:"M",color:"linear-gradient(135deg,#5865f2,#8b5cf6)",description:"A multipurpose Discord bot for moderation, levels, custom commands and server engagement.",website:"https://mee6.xyz/",discord:"https://discord.gg/mee6"},
 {name:"Dyno",letter:"D",color:"linear-gradient(135deg,#5865f2,#3b82f6)",description:"A powerful server management bot with moderation, automod, custom commands and more.",website:"https://dyno.gg/",discord:"https://discord.gg/dyno"},
 {name:"Carl-bot",letter:"C",color:"linear-gradient(135deg,#ec4899,#8b5cf6)",description:"Reaction roles, moderation, logging, automod and other tools to help manage your community.",website:"https://carl.gg/",discord:"https://discord.gg/carlbot"},
 {name:"ProBot",letter:"P",color:"linear-gradient(135deg,#06b6d4,#6366f1)",description:"Server moderation, welcome messages, leveling and customizable community features.",website:"https://probot.io/",discord:"https://discord.gg/probot"},
 {name:"Ticket Tool",letter:"T",color:"linear-gradient(135deg,#f59e0b,#ef4444)",description:"Create and manage support tickets with a dedicated ticket system for your server.",website:"https://tickettool.xyz/",discord:"https://discord.gg/tt"},
 {name:"YAGPDB",letter:"Y",color:"linear-gradient(135deg,#10b981,#0ea5e9)",description:"A flexible utility bot with moderation, role menus, custom commands and automation.",website:"https://yagpdb.xyz/",discord:"https://discord.gg/yagpdb"}
];
const list=document.getElementById("bot-list");
for(const bot of bots){
 const card=document.createElement("article");card.className="bot";
 const logo=document.createElement("div");logo.className="logo";logo.style.background=bot.color;logo.textContent=bot.letter;
 const info=document.createElement("div");info.className="identity";
 const title=document.createElement("h2");title.className="name";title.textContent=bot.name;
 const desc=document.createElement("p");desc.className="description";desc.textContent=bot.description;
 info.append(title,desc);
 const actions=document.createElement("div");actions.className="actions";
 for(const [label,url,primary] of [["Add to server",bot.website,true],["Go to website",bot.website,false],["Go to Discord",bot.discord,false]]){
  const link=document.createElement("a");link.className="action"+(primary?" primary":"");link.href=url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=label;actions.append(link);
 }
 card.append(logo,info,actions);list.append(card);
}
</script>
</body>
</html>
