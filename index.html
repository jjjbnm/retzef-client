<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Discord Bots</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#101010;--line:#252525;--muted:#a1a1aa;--text:#f5f5f5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.page{width:min(880px,100% - 32px);margin:0 auto;padding:58px 0 72px}
header{margin-bottom:30px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#888;margin:0 0 12px}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.045em;margin:0;font-weight:750}
.subtitle{color:var(--muted);font-size:14px;margin:10px 0 0}
.empty{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#121212,#0c0c0c);padding:36px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:8px}
footer{margin-top:28px;text-align:center;color:#666;font-size:11px}
</style>
</head>
<body>
<main class="page">
<header>
<p class="eyebrow">RETZEF CLIENT · DIRECTORY</p>
<h1>Discord Bots</h1>
<p class="subtitle">Discover useful bots for your Discord server.</p>
</header>
<section class="empty" aria-live="polite">
<strong>No bots listed</strong>
There are currently no bots in the directory.
</section>
<footer>Bot details and links belong to their respective creators.</footer>
</main>
</body>
</html>
